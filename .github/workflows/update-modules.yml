name: Update pox modules

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: update-pox-modules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 zip unzip

      - name: Test the Magisk-to-TWRP converter
        run: sudo tools/test_magisk2twrp.sh

      - name: Build modules for the latest pox release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/build_pox_modules.sh

      - name: Commit new modules
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/begonia)" ]; then
            git add data/begonia
            git commit -m "modules: add md_patcher for latest pox release"
            git push
          else
            echo "No new modules."
          fi

      - name: Package tool
        run: tools/package_release.sh

      - name: Build TWRP template from the bundled module base
        run: tools/magisk2twrp.sh data/patch.zip "out/mtk_imei-twrp-template-$(date +%Y%m%d).zip"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="latest"
          notes="Automatically rebuilt md_patcher modules for the latest pox-begonia-kernel release. The single imei_repair zip autodetects the running kernel. mtk_imei-twrp-template is the TWRP-flashable conversion (tools/magisk2twrp.sh) of the bundled Magisk module base."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --title "MTK IMEI patcher (latest)" --notes "$notes" --latest
          fi
          gh release upload "$tag" out/mtk_imei-*.zip --clobber
